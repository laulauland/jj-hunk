[package]
name = "jj-hunk"
version = "0.5.1"
edition = "2021"
description = "Programmatic hunk selection for jj"
license = "MIT"
repository = "https://github.com/laulauland/jj-hunk"

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ name }/{ version }/bin/{ bin }{ binary-ext }"

# Release assets use Homebrew bottle names, not Rust target triples.
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }.arm64_sequoia.bottle.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }.x86_64_linux.bottle.tar.gz"

[workspace]
members = ["crates/hunkset"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
anyhow = "1"
walkdir = "2"
serde_yaml = "0.9"
sha2 = "0.10"
hunkset = { path = "crates/hunkset" }
tempfile = "3"
